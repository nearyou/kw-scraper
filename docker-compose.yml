services:
  rabbitmq:
    image: rabbitmq:3.12-alpine
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 256
    stop_grace_period: 30s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery:
    build: .
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 4g
    pids_limit: 512
    stop_grace_period: 60s
    shm_size: 2gb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ekwscraper_admin:${DB_PASSWORD}@host.docker.internal:5432/kwscraper
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      DOWNLOAD_WORKERS: "12"
      PARSING_WORKERS: "4"
      IN_FLIGHT_LIMIT: "36"
      RATE_LIMIT_MIN: "0.5"
      RATE_LIMIT_MAX: "1.5"
      CB_THRESHOLD: "5"
      CB_BASE: "5"
      CB_MAX: "60"
      DEPENDENCY_MAX_ATTEMPTS: "30"
      PROXY_HOST: ${PROXY_HOST:-}
      PROXY_PORT: ${PROXY_PORT:-}
      PROXY_USERNAME: ${PROXY_USERNAME:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
      PROXY_SCHEME: ${PROXY_SCHEME:-http}
      PROXY_REPLACE_EXISTING: ${PROXY_REPLACE_EXISTING:-false}
      SERVICE_NAME: celery
      LOG_LEVEL: INFO
      CONSOLE_LOG_LEVEL: ERROR
      LOG_FILE: /app/logs/celery.log
    volumes:
      - app-logs:/app/logs
    healthcheck:
      # Use the broker URL directly so the probe does not import the app and
      # accidentally run application startup hooks on every health check.
      test: ["CMD-SHELL", "celery -b $$CELERY_BROKER_URL inspect ping --destination celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: ["celery", "-A", "www.main.celery", "worker", "--loglevel=error", "--concurrency=4"]

  web:
    build: .
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 45s
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ekwscraper_admin:${DB_PASSWORD}@host.docker.internal:5432/kwscraper
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      FLASK_ENV: production
      DEPENDENCY_MAX_ATTEMPTS: "30"
      SERVICE_NAME: web
      LOG_LEVEL: INFO
      CONSOLE_LOG_LEVEL: ERROR
      LOG_FILE: /app/logs/web.log
      HEALTH_MAX_ERROR_RATE: "0.25"
      HEALTH_ERROR_WINDOW_SECONDS: "3600"
      HEALTH_MAX_SCRAPE_AGE_SECONDS: "86400"
    volumes:
      - app-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command:
      - gunicorn
      - --workers
      - "2"
      - --threads
      - "2"
      - --worker-class
      - gthread
      - --bind
      - 0.0.0.0:5000
      - --timeout
      - "300"
      - --graceful-timeout
      - "30"
      - --keep-alive
      - "5"
      - --max-requests
      - "1000"
      - --max-requests-jitter
      - "50"
      - www.main:app

  scraper:
    build: .
    # Retry crashes, but do not relaunch a scraper that completed normally.
    restart: "on-failure:5"
    cpus: "3.0"
    mem_limit: 6g
    pids_limit: 768
    stop_grace_period: 60s
    shm_size: 4gb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://ekwscraper_admin:${DB_PASSWORD}@host.docker.internal:5432/kwscraper
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      DOWNLOAD_WORKERS: "12"
      PARSING_WORKERS: "4"
      IN_FLIGHT_LIMIT: "36"
      RATE_LIMIT_MIN: "0.5"
      RATE_LIMIT_MAX: "1.5"
      CB_THRESHOLD: "5"
      CB_BASE: "5"
      CB_MAX: "60"
      DEPENDENCY_MAX_ATTEMPTS: "30"
      PROXY_HOST: ${PROXY_HOST:-}
      PROXY_PORT: ${PROXY_PORT:-}
      PROXY_USERNAME: ${PROXY_USERNAME:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
      PROXY_SCHEME: ${PROXY_SCHEME:-http}
      PROXY_REPLACE_EXISTING: ${PROXY_REPLACE_EXISTING:-false}
      SERVICE_NAME: scraper
      LOG_LEVEL: INFO
      CONSOLE_LOG_LEVEL: ERROR
      LOG_FILE: /app/logs/scraper.log
    volumes:
      - app-logs:/app/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "DEPENDENCY_MAX_ATTEMPTS=1 python /app/scripts/wait_for_dependencies.py"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    profiles:
      - scrape

volumes:
  rabbitmq-data:
  app-logs:
