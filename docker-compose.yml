version: "3.9"

services:
  # Message Broker for Celery
  rabbitmq:
    image: rabbitmq:3.12-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    # Gwarancja, że broker faktycznie przyjmuje połączenia przed startem reszty
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Celery Worker - processes background scraping tasks
  celery:
    build: .
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy # Zmieniono ze service_started
    environment:
      - DATABASE_URL=postgresql://ekwscraper_admin:${DB_PASSWORD}@host.docker.internal:5432/kwscraper
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - DOWNLOAD_WORKERS=12
      - PARSING_WORKERS=4
      - IN_FLIGHT_LIMIT=36
      - RATE_LIMIT_MIN=0.5
      - RATE_LIMIT_MAX=1.5
      - CB_THRESHOLD=5
      - CB_BASE=5
      - CB_MAX=60
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    shm_size: 4gb
    # Healthcheck monitorujący stan workera przez protokół AMQP
    healthcheck:
      test: ["CMD-SHELL", "celery -A www.main.celery inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    command: celery -A www.main.celery worker --loglevel=info --concurrency=4

  # Web Application (Flask + Gunicorn)
  web:
    build: .
    restart: always
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy # Zmieniono ze service_started
    environment:
      - DATABASE_URL=postgresql://ekwscraper_admin:${DB_PASSWORD}@host.docker.internal:5432/kwscraper
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - FLASK_ENV=production
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      gunicorn
      --workers 2
      --threads 2
      --worker-class gthread
      --bind 0.0.0.0:5000
      --timeout 300
      --keep-alive 5
      --max-requests 1000
      --max-requests-jitter 50
      www.main:app

  # Scraper (runs Chrome via DrissionPage)
  scraper:
    build: .
    restart: "no" # Dla profilu uruchamianego ręcznie (wątek efemeryczny) restart: "no" jest ok
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://ekwscraper_admin:${DB_PASSWORD}@host.docker.internal:5432/kwscraper
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - DOWNLOAD_WORKERS=12
      - PARSING_WORKERS=4
      - IN_FLIGHT_LIMIT=36
      - RATE_LIMIT_MIN=0.5
      - RATE_LIMIT_MAX=1.5
      - CB_THRESHOLD=5
      - CB_BASE=5
      - CB_MAX=60
    depends_on:
      rabbitmq:
        condition: service_healthy # Zmieniono ze service_started
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: "3.0"
    shm_size: 4gb
    profiles:
      - scrape
